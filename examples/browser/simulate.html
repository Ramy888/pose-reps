<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pose-reps: simulated squats</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; background: #0a0b10; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c" width="720" height="440"></canvas>
<script type="module">
  // Animates a side-view stick figure from synthetic keypoints and feeds every frame to the real
  // squat detector. No camera needed. ?record=1 renders frames on demand (window.renderFrame) for
  // scripts/record-demo.mjs; otherwise it plays in a loop.
  import {CUE_TEXT, J, createDetector} from "../../dist/index.js";

  const FPS = 30;
  const STAND = 178;
  // Knee angle keyframes [seconds, degrees]: full squat, full squat, half squat, full squat.
  const KEYS = [];
  let t = 0.6;
  KEYS.push([0, STAND], [t, STAND]);
  for (const depth of [82, 82, 132, 82]) {
    KEYS.push([t += 0.9, depth], [t += 0.25, depth], [t += 0.9, STAND], [t += 0.5, STAND]);
  }
  const DURATION = t + 0.8;
  export const totalFrames = Math.round(DURATION * FPS);

  const ease = (x) => (1 - Math.cos(Math.PI * x)) / 2;
  function kneeAt(s) {
    for (let i = 1; i < KEYS.length; i++) {
      const [t0, a0] = KEYS[i - 1], [t1, a1] = KEYS[i];
      if (s <= t1) return a0 + (a1 - a0) * ease((s - t0) / (t1 - t0 || 1));
    }
    return STAND;
  }

  // Side view: ankle fixed, shin leans forward and thigh back by the same amount, so the
  // hip-knee-ankle angle equals `knee`.
  function pose(knee) {
    const kp = Array.from({length: 33}, () => [0.5, 0.5, 1]);
    const L = 0.2, a = ((180 - knee) / 2) * Math.PI / 180;
    const ankle = [0.52, 0.9];
    const kneeP = [ankle[0] + L * Math.sin(a), ankle[1] - L * Math.cos(a)];
    const hip = [kneeP[0] - L * Math.sin(a), kneeP[1] - L * Math.cos(a)];
    const lean = (180 - knee) / 180 * 0.09;
    const shoulder = [hip[0] + lean, hip[1] - 0.25];
    const wrist = [shoulder[0] + 0.03 + lean * 1.5, shoulder[1] + 0.2 - lean * 0.6];
    for (const [side, dx] of [[0, -0.006], [1, 0.006]]) {
      kp[J.leftAnkle + side] = [ankle[0] + dx, ankle[1], 1];
      kp[J.leftKnee + side] = [kneeP[0] + dx, kneeP[1], 1];
      kp[J.leftHip + side] = [hip[0] + dx, hip[1], 1];
      kp[J.leftShoulder + side] = [shoulder[0] + dx, shoulder[1], 1];
      kp[J.leftElbow + side] = [(shoulder[0] + wrist[0]) / 2 + 0.03, (shoulder[1] + wrist[1]) / 2, 1];
      kp[J.leftWrist + side] = [wrist[0] + dx, wrist[1], 1];
    }
    return kp;
  }

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const FIG = {x: 40, y: 20, w: 360, h: 400};
  // Same scale on both axes, so the drawn knee angle is the measured one.
  const at = (p) => [FIG.x + FIG.w / 2 + (p[0] - 0.52) * FIG.h, FIG.y + p[1] * FIG.h];
  const BONES = [[J.leftShoulder, J.leftElbow], [J.leftElbow, J.leftWrist], [J.leftShoulder, J.leftHip],
    [J.leftHip, J.leftKnee], [J.leftKnee, J.leftAnkle]];

  let detector, cue = "", cueUntil = 0, flashUntil = 0;
  function reset() { detector = createDetector("squat"); cue = ""; cueUntil = 0; flashUntil = 0; }
  reset();

  function render(frame) {
    const now = frame * 1000 / FPS;
    const knee = kneeAt(frame / FPS);
    const kp = pose(knee);
    const u = detector.update(kp, now);
    if (u.cue) { cue = CUE_TEXT[u.cue]; cueUntil = now + 1400; }
    if (u.rep) { flashUntil = now + 450; }

    ctx.fillStyle = "#0a0b10"; ctx.fillRect(0, 0, W, H);
    // floor
    ctx.strokeStyle = "#2a2e40"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(40, at([0, 0.9])[1] + 6); ctx.lineTo(400, at([0, 0.9])[1] + 6); ctx.stroke();
    // figure
    ctx.lineCap = "round"; ctx.lineWidth = 9; ctx.strokeStyle = "#f4f5f7";
    for (const [a, b] of BONES) { ctx.beginPath(); ctx.moveTo(...at(kp[a])); ctx.lineTo(...at(kp[b])); ctx.stroke(); }
    const head = at(kp[J.leftShoulder]);
    ctx.beginPath(); ctx.arc(head[0] + 6, head[1] - 34, 22, 0, Math.PI * 2); ctx.fillStyle = "#f4f5f7"; ctx.fill();
    for (const i of [J.leftHip, J.leftKnee, J.leftAnkle]) {
      ctx.beginPath(); ctx.arc(...at(kp[i]), 8, 0, Math.PI * 2); ctx.fillStyle = "#c8ff3d"; ctx.fill();
    }
    // knee angle label
    const k = at(kp[J.leftKnee]);
    ctx.font = "600 18px system-ui, sans-serif"; ctx.fillStyle = "#a3a8b8";
    ctx.fillText(`${Math.round(u.metric ?? knee)}°`, k[0] + 16, k[1] + 6);

    // panel
    const px = 430;
    ctx.fillStyle = "#a3a8b8"; ctx.font = "600 16px system-ui, sans-serif";
    ctx.fillText("SQUATS · pose-reps", px, 60);
    ctx.fillStyle = now < flashUntil ? "#ffffff" : "#c8ff3d";
    ctx.font = "800 120px system-ui, sans-serif";
    ctx.fillText(String(u.reps), px, 190);
    ctx.fillStyle = "#a3a8b8"; ctx.font = "16px system-ui, sans-serif";
    ctx.fillText("full-depth reps", px, 218);
    ctx.fillText(`knee ${Math.round(u.metric ?? knee)}° · counts below 110°`, px, 250);
    if (now < cueUntil && cue) {
      ctx.font = "700 20px system-ui, sans-serif";
      const w = ctx.measureText(cue).width + 28;
      ctx.fillStyle = "#ffb547"; ctx.beginPath(); ctx.roundRect(px, 282, w, 40, 20); ctx.fill();
      ctx.fillStyle = "#1a1206"; ctx.fillText(cue, px + 14, 309);
    }
    ctx.fillStyle = "#5c6273"; ctx.font = "13px system-ui, sans-serif";
    ctx.fillText("Synthetic keypoints, real detector", px, 410);
  }

  window.totalFrames = totalFrames;
  window.renderFrame = (i) => { if (i === 0) reset(); render(i); return i; };
  if (!new URLSearchParams(location.search).has("record")) {
    let f = 0;
    setInterval(() => { if (f === 0) reset(); render(f); f = (f + 1) % totalFrames; }, 1000 / FPS);
  }
  window.ready = true;
</script>
</body>
</html>
